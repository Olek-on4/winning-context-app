[project]
name = "northstar-context-service"
version = "0.1.0"
description = "Evidence-backed, time-aware Context Service over the Northstar corpus"
license = "MPL-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "mcp>=1.2,<2",
]

[project.scripts]
ncs = "cli:main"
ncs-mcp = "mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["apps/context-service"]

[tool.hatch.build.targets.wheel.sources]
"apps/context-service" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api", "graph", "ingest", "models", "retrieval", "settings", "service", "cli", "mcp_server", "tests"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["apps/context-service", "tests"]
extraPaths = ["apps/context-service"]
