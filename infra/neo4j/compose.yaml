# Community edition on purpose: the schema uses uniqueness constraints only.
# Property-existence constraints are Enterprise-only (ADR-0006).
services:
  neo4j:
    image: neo4j:5-community
    container_name: etyt-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/etyt-context
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Embeddings + query planning. CPU only here: this host has no nvidia runtime,
  # so the GPU block below is documentation, not configuration.
  ollama:
    image: ollama/ollama
    container_name: etyt-ollama
    ports:
      # 11434 on the host already belongs to a host-side Ollama.
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Requires nvidia-container-toolkit on the host (`docker info` must list the
    # nvidia runtime) plus `deploy.resources.reservations.devices`. Absent, Ollama
    # serves from CPU and everything still works, just slower.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The service itself. The corpus is mounted read-only: the container writes only to
  # the graph, so a run can never mutate the submodule.
  app:
    build:
      context: ../../apps/context-service
      dockerfile: Dockerfile
    container_name: etyt-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: etyt-context
      CORPUS_ROOT: /repo/vendor/att-hackathon-task
      # Literal, not ${OLLAMA_HOST}: shells that export OLLAMA_HOST=localhost:11434
      # would make the container resolve it to itself and silently go lexical-only.
      OLLAMA_HOST: http://etyt-ollama:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      EXTRACTED_PATH: /data/local/claims-extracted.jsonl
      # Built UI on the host (`make ui-build`); the repo is mounted at /repo, read-only,
      # so the static mount needs no rebuild of the image.
      WEB_DIST: /repo/etynt_gui/dist
    volumes:
      # Whole repo read-only so `git log` dates work during extraction; data is writable.
      - ../..:/repo:ro
      - ../../data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  neo4j-data:
  ollama-models:
