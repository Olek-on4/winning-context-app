# Community edition on purpose: the schema uses uniqueness constraints only.
# Property-existence constraints are Enterprise-only (ADR-0006).
#
# Two stacks must coexist on one host (issue #70), so no service carries a
# `container_name:` — the compose service names (`neo4j`, `ollama`, `app`) double as
# network aliases inside the project, and the project name prefixes the real container
# names. Every published host port is overridable, because a second stack on the same
# host needs different host ports:
#
#   ETYT_PROJECT            compose project name (Makefile default: etyt). One stack per
#                           project; `docker compose -p etyt-b ...` is the second stack.
#   ETYT_NEO4J_HTTP_PORT    host port -> Neo4j HTTP/browser   (default 7474)
#   ETYT_NEO4J_BOLT_PORT    host port -> Neo4j bolt           (default 7687)
#   ETYT_OLLAMA_PORT        host port -> Ollama API           (default 11435; the host
#                           already has its own Ollama on 11434)
#   ETYT_APP_PORT           host port -> the app              (default 8000)
#
# Only the host side moves: inside the compose network the ports stay 7474/7687/11434/8000.
# Volumes are per-project, so two stacks never share a graph.
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:${ETYT_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${ETYT_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/etyt-context
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Embeddings + query planning. CPU only here: this host has no nvidia runtime,
  # so the GPU block below is documentation, not configuration.
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:${ETYT_OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Requires nvidia-container-toolkit on the host (`docker info` must list the
    # nvidia runtime) plus `deploy.resources.reservations.devices`. Absent, Ollama
    # serves from CPU and everything still works, just slower.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The service itself. The corpus is mounted read-only: the container writes only to
  # the graph, so a run can never mutate the submodule.
  app:
    # Repo root context: the image builds the UI from etynt_gui as well as the API.
    build:
      context: ../..
      dockerfile: apps/context-service/Dockerfile
    ports:
      - "127.0.0.1:${ETYT_APP_PORT:-8000}:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: etyt-context
      CORPUS_ROOT: /repo/vendor/att-hackathon-task
      # Service alias, never a container name: the project prefix is per-stack.
      # Literal, not ${OLLAMA_HOST}: shells that export OLLAMA_HOST=localhost:11434
      # would make the container resolve it to itself and silently go lexical-only.
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      EXTRACTED_PATH: /data/local/claims-extracted.jsonl
    volumes:
      # Keep the mount, but the image no longer needs it to boot: the built UI ships
      # inside the image, and the service answers /healthz with no corpus. Extraction and
      # span resolution inside the container still read the corpus, and `git log` dates
      # undated files, so the whole repo is mounted read-only. Data stays writable.
      - ../..:/repo:ro
      - ../../data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  neo4j-data:
  ollama-models:
