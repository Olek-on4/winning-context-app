[project]
name = "context-service"
version = "0.1.0"
description = "Evidence-backed, time-aware context service over the Northstar corpus"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "neo4j>=5.24",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=1.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Neo4j"]
