[project]
name = "context-service"
version = "0.1.0"
description = "Ety&T — evidence-backed, time-aware context service"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "neo4j>=5.24",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=1.2",
  "httpx>=0.27",
]

# Optional capabilities, never installed with the default. `diagram` is the zero-GPL
# reader+geometry set (LGPL-2.1 only, measured: docs/research/licence-boundary.md);
# `diagram-tesseract` carries GPL-2.0-or-later jbigkit and is gated by ingest/optin.py.
[project.optional-dependencies]
diagram = [
  "rapidocr>=3.10,<4",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pillow>=11",
  "networkx>=3.4",
]
diagram-tesseract = [
  "tesserocr>=2.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Degrading to a smaller answer is a designed behaviour (docs/06), so the broad
# excepts and the empty-pass fallbacks are deliberate, not accidents.
ignore = ["BLE001", "S110", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Neo4j"]
